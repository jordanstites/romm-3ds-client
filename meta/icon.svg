<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- RomM's own palette: background #0D1117, primary #8B74E8. -->
  <rect width="48" height="48" rx="9" fill="#0D1117"/>
  <rect x="1" y="1" width="46" height="46" rx="8" fill="none" stroke="#8B74E8" stroke-width="1.5" opacity="0.45"/>

  <!-- An open clamshell read top-down: two screens with a hinge between them.
       Plain rectangles, so it stays legible at 48px. -->
  <rect x="11" y="8"  width="26" height="15" rx="2" fill="#1C2330" stroke="#8B74E8" stroke-width="1.5"/>
  <rect x="11" y="26" width="26" height="14" rx="2" fill="#1C2330" stroke="#8B74E8" stroke-width="1.5"/>
  <rect x="13" y="24" width="22" height="1.5" rx="0.75" fill="#8B74E8" opacity="0.55"/>

  <!-- A download arrow on the top screen: what the app is for. -->
  <g fill="#8B74E8">
    <rect x="22.5" y="11" width="3" height="6" rx="1"/>
    <path d="M20 16 L24 21 L28 16 Z"/>
  </g>

  <!-- Library rows on the bottom screen. -->
  <g fill="#9E8CD6" opacity="0.75">
    <rect x="14" y="29.5" width="20" height="2" rx="1"/>
    <rect x="14" y="33"   width="20" height="2" rx="1"/>
    <rect x="14" y="36.5" width="13" height="2" rx="1"/>
  </g>
</svg>
