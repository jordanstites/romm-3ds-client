<svg xmlns="http://www.w3.org/2000/svg" width="256" height="128" viewBox="0 0 256 128">
  <!-- Shown on the Home Menu when installed as a CIA. RomM's palette. -->
  <rect width="256" height="128" fill="#0D1117"/>
  <rect y="124" width="256" height="4" fill="#8B74E8" opacity="0.6"/>

  <!-- Same clamshell mark as the icon, scaled up. -->
  <g transform="translate(28, 24) scale(1.7)">
    <rect x="0"  y="0"  width="26" height="15" rx="2" fill="#1C2330" stroke="#8B74E8" stroke-width="1.5"/>
    <rect x="0"  y="18" width="26" height="14" rx="2" fill="#1C2330" stroke="#8B74E8" stroke-width="1.5"/>
    <rect x="2"  y="16" width="22" height="1.5" rx="0.75" fill="#8B74E8" opacity="0.55"/>
    <g fill="#8B74E8">
      <rect x="11.5" y="3" width="3" height="6" rx="1"/>
      <path d="M9 8 L13 13 L17 8 Z"/>
    </g>
    <g fill="#9E8CD6" opacity="0.75">
      <rect x="3" y="21.5" width="20" height="2" rx="1"/>
      <rect x="3" y="25"   width="20" height="2" rx="1"/>
      <rect x="3" y="28.5" width="13" height="2" rx="1"/>
    </g>
  </g>

  <!-- sans-serif rather than a named face: this is rasterised by rsvg-convert,
       which resolves fonts from whatever host builds it. -->
  <text x="112" y="62" font-family="sans-serif" font-size="26" font-weight="bold" fill="#FEFDFE">RomM</text>
  <text x="112" y="88" font-family="sans-serif" font-size="20" fill="#8B74E8">3DS Client</text>
</svg>
