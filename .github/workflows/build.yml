name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The base image ships 3ds-dev but not these portlibs, which the client
      # links against for HTTPS. Without them the build fails at -lcurl.
      - name: Install 3DS portlibs
        run: dkp-pacman -S --noconfirm --needed 3ds-curl 3ds-mbedtls 3ds-zlib

      - name: Install host tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang-format librsvg2-bin

      - name: Build
        run: make EXTRA_CFLAGS=-Werror

      - name: Check formatting
        run: make format-check

      # The target name comes from the checkout directory, i.e. the repository
      # name. Globbing avoids hardcoding it in two places.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: romm-3ds-client
          path: build/output/*.3dsx
          if-no-files-found: error
