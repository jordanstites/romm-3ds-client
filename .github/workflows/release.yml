name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 3DS portlibs
        run: dkp-pacman -S --noconfirm --needed 3ds-curl 3ds-mbedtls 3ds-zlib

      - name: Install host tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang-format librsvg2-bin

      - name: Build
        run: make EXTRA_CFLAGS=-Werror

      - name: Check formatting
        run: make format-check

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Only the .3dsx is published. A CIA build needs bannertool and
          # makerom, and nothing here has been tested as a CIA -- shipping an
          # untested artifact alongside a working one invites bug reports about
          # a path nobody uses.
          files: build/output/*.3dsx
          fail_on_unmatched_files: true
